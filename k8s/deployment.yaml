apiVersion: apps/v1
kind: Deployment
metadata:
  name: build-agent
  namespace: build-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: build-agent
  template:
    metadata:
      labels:
        app: build-agent
    spec:
      containers:
        - name: build-agent
          image: REGISTRY/build-agent:latest
          ports:
            - containerPort: 8080
          env:
            - name: REPORTS_DIR
              value: "/reports"
            - name: POLL_SUBSCRIPTIONS
              value: ""  # set via ConfigMap or env
            - name: POLL_INTERVAL
              value: "300"
            - name: KB_SEARCH_URL
              value: "http://kb-search.kb-search.svc.cluster.local"
            - name: PORTAL_TOKEN_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: portal-credentials
                  key: token_endpoint
            - name: PORTAL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: portal-credentials
                  key: client_id
            - name: PORTAL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: portal-credentials
                  key: client_secret
            - name: PORTAL_RESOURCE
              valueFrom:
                secretKeyRef:
                  name: portal-credentials
                  key: resource
            - name: AI_CORE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-core-credentials
                  key: base_url
            - name: AI_CORE_TOKEN_URL
              valueFrom:
                secretKeyRef:
                  name: ai-core-credentials
                  key: token_url
            - name: AI_CORE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ai-core-credentials
                  key: client_id
            - name: AI_CORE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-core-credentials
                  key: client_secret
            - name: AI_CORE_DEPLOYMENT_ID
              valueFrom:
                secretKeyRef:
                  name: ai-core-credentials
                  key: deployment_id
            - name: AI_CORE_RESOURCE_GROUP
              valueFrom:
                secretKeyRef:
                  name: ai-core-credentials
                  key: resource_group
          volumeMounts:
            - name: reports
              mountPath: /reports
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      imagePullSecrets:
        - name: registry-secret
      volumes:
        - name: reports
          persistentVolumeClaim:
            claimName: build-agent-reports
---
apiVersion: v1
kind: Service
metadata:
  name: build-agent
  namespace: build-agent
spec:
  selector:
    app: build-agent
  ports:
    - port: 80
      targetPort: 8080
