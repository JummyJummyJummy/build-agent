apiVersion: batch/v1
kind: CronJob
metadata:
  name: build-agent-cleanup
  namespace: build-agent
spec:
  schedule: "0 2 * * *"   # 02:00 UTC daily
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: registry-secret
          containers:
            - name: cleanup
              image: REGISTRY/build-agent:latest
              command: ["python", "cleanup_reports.py"]
              env:
                - name: REPORTS_DIR
                  value: "/reports"
                - name: RETENTION_DAYS
                  value: "30"
              volumeMounts:
                - name: reports
                  mountPath: /reports
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "128Mi"
                  cpu: "200m"
          volumes:
            - name: reports
              persistentVolumeClaim:
                claimName: build-agent-reports
