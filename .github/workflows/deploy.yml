name: Build and Deploy to Kyma

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: jummy2026/build-agent
  NAMESPACE: build-agent
  SERVICE_URL: https://build-agent.c3378d8.kyma.ondemand.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: jummy2026
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config

      - name: Apply namespace and PVC
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/pvc.yaml

      - name: Create imagePullSecret
        run: |
          kubectl create secret docker-registry registry-secret \
            --namespace=${{ env.NAMESPACE }} \
            --docker-server=docker.io \
            --docker-username=jummy2026 \
            --docker-password=${{ secrets.DOCKERHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create portal credentials secret
        run: |
          kubectl create secret generic portal-credentials \
            --namespace=${{ env.NAMESPACE }} \
            --from-literal=token_endpoint=${{ secrets.PORTAL_TOKEN_ENDPOINT }} \
            --from-literal=client_id=${{ secrets.PORTAL_CLIENT_ID }} \
            --from-literal=client_secret=${{ secrets.PORTAL_CLIENT_SECRET }} \
            --from-literal=resource=${{ secrets.PORTAL_RESOURCE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create AI Core credentials secret
        env:
          AI_CORE_BASE_URL: ${{ secrets.AI_CORE_BASE_URL }}
          AI_CORE_TOKEN_URL: ${{ secrets.AI_CORE_TOKEN_URL }}
          AI_CORE_CLIENT_ID: ${{ secrets.AI_CORE_CLIENT_ID }}
          AI_CORE_CLIENT_SECRET: ${{ secrets.AI_CORE_CLIENT_SECRET }}
          AI_CORE_DEPLOYMENT_ID: ${{ secrets.AI_CORE_DEPLOYMENT_ID }}
          AI_CORE_RESOURCE_GROUP: ${{ secrets.AI_CORE_RESOURCE_GROUP }}
        run: |
          python3 -c "
          import os, base64, subprocess, sys
          ns = os.environ['NAMESPACE']
          m = {
            'base_url': 'AI_CORE_BASE_URL',
            'token_url': 'AI_CORE_TOKEN_URL',
            'client_id': 'AI_CORE_CLIENT_ID',
            'client_secret': 'AI_CORE_CLIENT_SECRET',
            'deployment_id': 'AI_CORE_DEPLOYMENT_ID',
            'resource_group': 'AI_CORE_RESOURCE_GROUP',
          }
          data = ''.join(f'  {k}: {base64.b64encode(os.environ[v].encode()).decode()}\n' for k,v in m.items())
          yaml = f'apiVersion: v1\nkind: Secret\nmetadata:\n  name: ai-core-credentials\n  namespace: {ns}\ntype: Opaque\ndata:\n{data}'
          r = subprocess.run([\"kubectl\",\"apply\",\"-f\",\"-\"], input=yaml.encode(), capture_output=True)
          sys.stdout.write(r.stdout.decode()); sys.stderr.write(r.stderr.decode()); sys.exit(r.returncode)
          "

      - name: Create KB search token secret
        run: |
          kubectl create secret generic kb-search-token \
            --namespace=${{ env.NAMESPACE }} \
            --from-literal=token=${{ secrets.KB_ADMIN_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          sed "s|REGISTRY/build-agent:latest|${IMAGE}|g" k8s/deployment.yaml | kubectl apply -f -
          sed "s|REGISTRY/build-agent:latest|${IMAGE}|g" k8s/cronjob-cleanup.yaml | kubectl apply -f -
          kubectl apply -f k8s/apirule.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/build-agent -n ${{ env.NAMESPACE }} --timeout=300s
